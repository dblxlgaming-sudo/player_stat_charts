<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Triple Threat — Player Stat Charts</title>
<style>
  :root{
    --bg:#05070c;
    --panel:#131c2e;
    --panel2:#0f1728;
    --line:#223049;
    --text:#eef2f7;
    --muted:#7e93ac;
    --green:#22c55e;
    --red:#ef4444;
    --accent:#3b82f6;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:'Segoe UI',Arial,sans-serif;min-height:100vh;}
  header{padding:20px 24px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:10;}
  header h1{margin:0 0 14px;font-size:18px;}
  .searchwrap{position:relative;max-width:480px;}
  #search{width:100%;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--text);font-size:14px;outline:none;}
  #search:focus{border-color:var(--accent);}
  .backbtn{display:none;background:var(--panel);border:1px solid var(--line);color:var(--text);padding:8px 14px;border-radius:8px;cursor:pointer;font-size:13px;margin-bottom:14px;}
  .backbtn.show{display:inline-block;}

  main{max-width:760px;margin:0 auto;padding:20px 24px;}

  #directory{display:flex;flex-direction:column;gap:6px;}
  .playerrow{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;background:var(--panel);border:1px solid var(--line);border-radius:10px;cursor:pointer;transition:border-color .15s;}
  .playerrow:hover{border-color:var(--accent);}
  .playerrow .name{font-size:14px;font-weight:600;}
  .playerrow .meta{font-size:11px;color:var(--muted);}
  .emptystate{text-align:center;color:var(--muted);padding:60px 20px;font-size:13px;}

  #detail{display:none;}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:16px;}
  h2{margin:0 0 4px;font-size:19px;}
  .sub{color:var(--muted);font-size:12px;margin-bottom:16px;}

  .stattabs{display:flex;gap:6px;margin-bottom:18px;flex-wrap:wrap;}
  .stattab{padding:8px 14px;border-radius:8px;background:var(--panel2);border:1px solid var(--line);color:var(--muted);font-size:12px;font-weight:600;cursor:pointer;}
  .stattab.active{background:var(--accent);color:#fff;border-color:var(--accent);}

  .surface-label{
    font-size:10px;
    color:var(--muted);
    text-transform:uppercase;
    letter-spacing:.8px;
    margin:0 0 7px;
  }
  .surfacetabs{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap;}
  .surfacetab{
    padding:8px 14px;
    border-radius:8px;
    background:var(--panel2);
    border:1px solid var(--line);
    color:var(--muted);
    font-size:12px;
    font-weight:600;
    cursor:pointer;
  }
  .surfacetab.active{
    background:var(--accent);
    color:#fff;
    border-color:var(--accent);
  }
  .surface-summary{
    font-size:11px;
    color:var(--muted);
    margin:-6px 0 14px;
  }

  .badges{display:flex;gap:8px;margin-bottom:16px;}
  .badge{flex:1;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:10px 6px;text-align:center;}
  .badge .label{font-size:10px;color:var(--muted);}
  .badge .hr{font-size:16px;font-weight:700;color:var(--green);}
  .badge .avg{font-size:11px;color:var(--muted);}

  .linerow{display:flex;align-items:center;gap:10px;margin-bottom:16px;}
  .linerow label{font-size:12px;color:var(--muted);}
  .linerow input{width:70px;padding:6px 8px;border-radius:6px;border:1px solid var(--line);background:var(--panel2);color:var(--text);font-size:13px;}
  .linepresets{display:flex;gap:5px;}
  .linepreset{padding:6px 9px;border-radius:6px;background:var(--panel2);border:1px solid var(--line);color:var(--muted);font-size:11px;cursor:pointer;}
  .linepreset.active{border-color:var(--accent);color:#fff;}

  .chartwrap{position:relative;}
  .chart1{display:flex;align-items:flex-end;gap:5px;height:190px;border-bottom:1px dashed var(--line);position:relative;margin-bottom:8px;}
  .bar1{flex:1;border-radius:4px 4px 0 0;position:relative;cursor:pointer;display:flex;align-items:flex-start;justify-content:center;padding-top:4px;font-size:10px;font-weight:700;color:#04150a;min-height:2px;transition:opacity .1s;}
  .bar1:hover{opacity:.8;}
  .bar1.green{background:var(--green);}
  .bar1.red{background:var(--red);color:#2a0505;}
  .avgline{position:absolute;left:0;right:0;border-top:1px dashed var(--muted);}
  .xlabels{display:flex;gap:5px;}
  .xlabels div{flex:1;text-align:center;font-size:9px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

  .tooltip{display:none;position:absolute;background:var(--panel2);border:1px solid var(--accent);border-radius:8px;padding:10px 12px;font-size:11px;z-index:20;pointer-events:none;min-width:150px;box-shadow:0 4px 16px rgba(0,0,0,.4);}
  .tooltip .t1{font-weight:700;margin-bottom:4px;}
  .tooltip .t2{color:var(--muted);}
  @media (max-width: 480px){
    .chart1{ height:150px; }
    .bar1{ font-size:8px; }
    .xlabels div{ font-size:7px; }
    header h1{ font-size:16px; }
  }
</style>
</head>
<body>

<header>
  <h1>Triple Threat — Player Stat Charts</h1>
  <button class="backbtn" id="backBtn" onclick="showDirectory()">&larr; Back to search</button>
  <div class="searchwrap" id="searchWrap">
    <input type="text" id="search" placeholder="Search player name..." oninput="filterDirectory()">
  </div>
</header>

<main>
  <div id="directory"></div>

  <div id="detail">
    <div class="card">
      <h2 id="playerName"></h2>
      <div class="sub" id="playerSub"></div>

      <div class="stattabs" id="statTabs"></div>

      <div class="surface-label">Surface</div>
      <div class="surfacetabs" id="surfaceTabs"></div>
      <div class="surface-summary" id="surfaceSummary"></div>

      <div class="linerow">
        <label>Line:</label>
        <input type="number" id="lineInput" step="0.5" value="0" oninput="renderChart()">
        <div class="linepresets" id="linePresets"></div>
        <span class="sub" id="lineHint" style="margin:0"></span>
      </div>
      <div class="stattabs" id="windowTabs" style="margin-bottom:16px;"></div>

      <div class="badges" id="badges"></div>

      <div class="chartwrap">
        <div class="chart1" id="chart1"></div>
        <div class="xlabels" id="xlabels1"></div>
        <div class="tooltip" id="tooltip"></div>
      </div>
    </div>
  </div>
</main>

<script src="app.js"></script>
</body>
</html>
